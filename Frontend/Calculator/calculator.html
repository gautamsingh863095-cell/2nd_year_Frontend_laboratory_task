<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        div {
            width: 240px;
            height: 320px;
            border: 2px solid black;
            text-align: center;
            margin: 30px;
            background-color: #f5f5f5;
        }

        #display {
            width: 210px;
            height: 25px;
            padding: 5px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        table {
            border: 2px solid : white;
            background-color: white;
            text-align: center;
            margin: auto;
            width: 220px;
            height: 240px;
        }

        button {
            width: 45px;
            height: 40px;
            cursor: pointer;
        }

        td {
            padding: 2px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" id="display" readonly>

        <table>
            <tr>
                <td><button onclick="clearDisplay()">AC</button></td>
                <td><button onclick="add('/')">/</button></td>
                <td><button onclick="add('*')">*</button></td>
                <td><button onclick="add('-')">-</button></td>
            </tr>

            <tr>
                <td><button onclick="add('7')">7</button></td>
                <td><button onclick="add('8')">8</button></td>
                <td><button onclick="add('9')">9</button></td>
                <td><button onclick="add('+')">+</button></td>
            </tr>

            <tr>
                <td><button onclick="add('4')">4</button></td>
                <td><button onclick="add('5')">5</button></td>
                <td><button onclick="add('6')">6</button></td>
                <td><button onclick="calculate()">=</button></td>
            </tr>

            <tr>
                <td><button onclick="add('1')">1</button></td>
                <td><button onclick="add('2')">2</button></td>
                <td><button onclick="add('3')">3</button></td>
                <td><button onclick="add('.')">.</button></td>
            </tr>

            <tr>
                <td colspan="4">
                    <button style="width: 190px;" onclick="add('0')">0</button>
                </td>
            </tr>
        </table>

    </div>

    <script>
        let display = document.getElementById("display");

        function add(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = "";
        }

        function calculate() {
            try {
                if (display.value === "") return;

                let result = Function(
                    '"use strict"; return (' + display.value + ')'
                )();

                display.value = Number.isFinite(result)
                    ? result
                    : "Error";
            }
            catch {
                display.value = "Error";
            }
        }
    </script>

</body>
</html>
