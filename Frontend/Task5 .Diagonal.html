<!DOCTYPE html>
<html>
<head>
    <title>Diagonal</title>

    <style>
        .box {
            height: 300px;
            width: 300px;
            border: 2px solid black;
            background-color: lightblue;

            position: relative;
        }

        .diagonal {
            height: 2px;
            width: 420px;
            background-color: red;

            position: absolute;
            top: 150px;
            left: -60px;

            transform: rotate(45deg);
        }
    </style>
</head>

<body>

    <h1>Diagonal Design</h1>

    <div class="box">
        <div class="diagonal"></div>
    </div>

</body>
</html>
